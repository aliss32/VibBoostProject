name: Auto-Release on Program Update

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/Program.cs'
      - '.github/workflows/build.yml'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build and Publish
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Compress Release Files
      run: Compress-Archive -Path ./publish/* -DestinationPath ./VibBoost-Web-Release.zip

    - name: Generate Dynamic Version Tag
      id: date
      run: echo "date=$(Get-Date -Format 'yyyyMMdd-HHmmss')" >> $env:GITHUB_ENV

    - name: Create Auto Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./VibBoost-Web-Release.zip
        tag_name: build-${{ env.date }}
        name: VibBoost Auto-Build (${{ env.date }})
        body: |
          🚀 **Automated Release triggered by update.**
          
          New changes have been pushed to the codebase or workflow. Download and extract the .zip below (includes the .exe and the wwwroot folder for the Web GUI).
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
